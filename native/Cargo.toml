[package]
name = "bgc-native"
version = "0.2.1"
edition = "2021"
rust-version = "1.89"
license = "MIT"

[features]
default = []
# Source-only metadata reader drafts. Keep out of normal/release command routes
# until their separate validation and support-promotion gates are completed.
development-audits = []

[dependencies]
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tga", "pnm", "qoi", "gif", "dds"] }
image_dds = { version = "=0.7.2", default-features = false, features = ["image", "encode"] }
nanomp3 = "=0.2.0"
lz4 = "=1.28.1"
lewton = { version = "=0.10.2", default-features = false }
vorbis_rs = { version = "=0.5.6", default-features = false }
ogg = "=0.9.2"
crc32fast = "=1.5.0"
sha1 = "=0.10.6"
libc = "=0.2.189"
phf = { version = "=0.11.3", features = ["macros"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
